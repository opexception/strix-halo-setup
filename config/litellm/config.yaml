model_list:
  - model_name: os.environ/LITELLM_MODEL_NAME
    litellm_params:
      model: os.environ/OLLAMA_PROVIDER_MODEL
      api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
